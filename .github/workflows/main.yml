name: RoadSOS Production CI

on:
  push:
    branches: [ main, nitish ]
  pull_request:
    branches: [ main ]

jobs:
  quality-assurance:
    name: Lint & Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --set-exit-if-changed lib/
        continue-on-error: true

      - name: Analyze code
        run: flutter analyze
        continue-on-error: true

