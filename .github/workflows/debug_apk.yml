name: Debug Build (Sachin)

on:
  push:
    branches: [sachin-workspace]
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.41.9'
  JAVA_VERSION: '17'

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Debug APK
        run: |
          flutter build apk --debug \
            --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
            --dart-define=SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}" \
            --dart-define=POWERSYNC_URL="${{ secrets.POWERSYNC_URL }}" \
            --dart-define=SMS_DISPATCH_URL="${{ secrets.SMS_DISPATCH_URL }}" \
            --dart-define=SMS_DISPATCH_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: roadsos-debug-sachin
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
