name: Build APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Run manually from the Actions tab (no secrets needed for a demo build)
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: false
        default: 'debug'
        type: choice
        options: [debug, release]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true   # cancel a running build if a new push arrives

env:
  FLUTTER_VERSION: '3.24.5'
  JAVA_VERSION: '17'

jobs:
  build:
    name: Build APK (${{ github.event.inputs.build_type || 'debug' }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── Checkout ────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Java ────────────────────────────────────────────────────────────────
      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # ── Flutter ─────────────────────────────────────────────────────────────
      - name: Set up Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          cache-key: flutter-${{ env.FLUTTER_VERSION }}

      # ── Pub cache ───────────────────────────────────────────────────────────
      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      # ── Gradle cache ────────────────────────────────────────────────────────
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # ── Dependencies ────────────────────────────────────────────────────────
      - name: Install Flutter dependencies
        run: flutter pub get

      # ── Build ───────────────────────────────────────────────────────────────
      # Secrets passed via --dart-define so they are compiled in but never
      # appear in the repo or artifact filesystem.
      # All defines are optional: the app degrades gracefully when absent.
      - name: Build Debug APK
        if: ${{ github.event.inputs.build_type != 'release' }}
        run: |
          flutter build apk --debug \
            --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
            --dart-define=SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}" \
            --dart-define=POWERSYNC_URL="${{ secrets.POWERSYNC_URL }}" \
            --dart-define=SMS_DISPATCH_URL="${{ secrets.SMS_DISPATCH_URL }}" \
            --dart-define=SMS_DISPATCH_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}"

      - name: Build Release APK
        if: ${{ github.event.inputs.build_type == 'release' }}
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
            --dart-define=SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}" \
            --dart-define=POWERSYNC_URL="${{ secrets.POWERSYNC_URL }}" \
            --dart-define=SMS_DISPATCH_URL="${{ secrets.SMS_DISPATCH_URL }}" \
            --dart-define=SMS_DISPATCH_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}"

      # ── Rename APK with commit info ─────────────────────────────────────────
      - name: Rename APK
        run: |
          SHORT_SHA="${{ github.sha }}"
          SHORT_SHA="${SHORT_SHA:0:7}"
          BUILD="${{ github.event.inputs.build_type || 'debug' }}"
          SRC="build/app/outputs/flutter-apk/app-${BUILD}.apk"
          DEST="build/app/outputs/flutter-apk/roadsos-${BUILD}-${SHORT_SHA}.apk"
          mv "$SRC" "$DEST"
          echo "APK_PATH=$DEST" >> "$GITHUB_ENV"
          echo "APK_NAME=roadsos-${BUILD}-${SHORT_SHA}.apk" >> "$GITHUB_ENV"

      # ── Upload artifact ─────────────────────────────────────────────────────
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: ${{ env.APK_PATH }}
          retention-days: 30

      # ── Job summary ─────────────────────────────────────────────────────────
      - name: Write job summary
        run: |
          echo "## RoadSOS APK Build ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| APK | \`${{ env.APK_NAME }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Flutter | ${{ env.FLUTTER_VERSION }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build type | ${{ github.event.inputs.build_type || 'debug' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Install on Android" >> $GITHUB_STEP_SUMMARY
          echo "1. Download the APK from the **Artifacts** section below" >> $GITHUB_STEP_SUMMARY
          echo "2. On your Android device: **Settings → Security → Install unknown apps** → allow your browser or Files app" >> $GITHUB_STEP_SUMMARY
          echo "3. Open the downloaded APK and tap **Install**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Add secrets for full functionality" >> $GITHUB_STEP_SUMMARY
          echo "Go to **Settings → Secrets → Actions** in this repo and add:" >> $GITHUB_STEP_SUMMARY
          echo "- \`SUPABASE_URL\` — your Supabase project URL" >> $GITHUB_STEP_SUMMARY
          echo "- \`SUPABASE_ANON_KEY\` — your Supabase anon/public key" >> $GITHUB_STEP_SUMMARY
          echo "- \`POWERSYNC_URL\` — PowerSync instance URL (optional)" >> $GITHUB_STEP_SUMMARY
          echo "- \`SMS_DISPATCH_URL\` — SMS relay endpoint (optional)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> The app works without secrets — cloud triage and family tracking will be offline-only." >> $GITHUB_STEP_SUMMARY
