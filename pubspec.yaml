name: roadsos
description: "RoadSOS — Gemma 4 powered offline-first road emergency platform for India."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  path: ^1.9.1
  flutter_markdown: ^0.7.7

  cupertino_icons: ^1.0.8
  google_fonts: ^6.3.3
  supabase_flutter: ^2.12.4
  powersync: ^2.1.0
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.5
  flutter_riverpod: ^2.5.1
  flutter_blue_plus: ^2.3.2
  url_launcher: ^6.3.2
  geolocator: ^14.0.2
  uuid: ^4.5.3
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  flutter_map_animations: ^0.7.0
  sensors_plus: ^7.0.0
  flutter_ble_peripheral: ^2.1.0
  country_codes: ^3.3.0
  http: ^1.6.0
  flutter_dotenv: ^6.0.1
  flutter_tts: ^4.2.5
  speech_to_text: ^7.3.0
  cryptography: ^2.9.0
  shared_preferences: ^2.5.5
  cryptography_flutter: ^2.3.4
  flutter_background_service: ^5.1.0
  flutter_local_notifications: ^21.0.0
  package_info_plus: ^9.0.1
  encrypt: ^5.0.3
  crypto: ^3.0.7
  flutter_secure_storage: ^10.1.0
  logger: ^2.6.2
  permission_handler: ^11.4.0
  flutter_map_tile_caching: ^10.0.0
  image_picker: ^1.1.2
  flutter_inappwebview: ^6.0.0
  qr_flutter: ^4.1.0

  # Screen wake lock during active SOS — keeps dispatch panel visible.
  # Maps to FLAG_KEEP_SCREEN_ON (Android) / isIdleTimerDisabled (iOS).
  wakelock_plus: ^1.1.5

  # Connectivity-aware triage tier selection.
  # Enables instant skip of Tier 1 cloud call (saves the 5s timeout)
  # when device has no network — critical for Indian highway scenarios.
  connectivity_plus: ^6.1.4

  # Gemma 4 on-device inference via MediaPipe / LiteRT.
  # Tier 2: Gemma 4 E4B (Edge 4B, ~2.4 GB Q4_K_M) runs offline on device.
  # Satisfies Cactus + LiteRT special prizes.
  # Requires model download (~2.4 GB) during onboarding — see GemmaLocalService.
  # pub.dev: https://pub.dev/packages/flutter_gemma
  flutter_gemma: ^0.3.0

  # Firebase — required by NearbySosPushService (opt-in bystander alerts).
  # The service degrades gracefully when google-services.json is absent.
  firebase_core: ^3.0.0
  firebase_messaging: ^15.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.14.1

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/env.template
    - assets/first_aid/corpus.json
    - assets/data/government_facilities_seed.json
    - assets/legal/privacy_policy_en.txt
    - assets/legal/privacy_policy_hi.txt
